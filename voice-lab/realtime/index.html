<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Тест OpenAI Realtime — BarberVoice</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0c0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800&family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    main { padding: 20px 0 60px; display: grid; gap: 14px; }
    h1 { font-size: 26px; margin: 0; }
    .muted { color: var(--muted); font-size: 14px; margin: 0; }
    #state { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; }
    .lat { font-size: 11px; color: var(--ok); display: block; margin-top: 4px; font-weight: 600; }
    #log .msg { max-width: 92%; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>OpenAI Realtime</h1>
    <p class="muted">OpenAI слышит тебя и сразу придумывает ответ, а произносит его армянский голос ElevenLabs. Ассистент проверяет настоящее расписание и записывает — записи видны в панели барбера. Под каждым ответом видно, через сколько секунд после конца твоей фразы она заговорила.</p>
    <div class="voices" role="group" aria-label="Speech">
      <button class="voice" data-speech="elevenlabs" aria-pressed="true"><span class="av">Հ</span><span><b>Армянский голос</b><span>OpenAI думает, ElevenLabs говорит</span></span></button>
      <button class="voice" data-speech="openai" aria-pressed="false"><span class="av">AI</span><span><b>Голос OpenAI</b><span>с акцентом, для сравнения</span></span></button>
    </div>
    <div class="voices" role="group" aria-label="Voice">
      <button class="voice" data-voice="female" aria-pressed="true"><span class="av">Ա</span><span><b>Женский</b><span>Ани</span></span></button>
      <button class="voice" data-voice="male" aria-pressed="false"><span class="av">Ա</span><span><b>Мужской</b><span>Арам</span></span></button>
    </div>
    <label class="field">Номер звонящего (демо). На настоящей линии он определяется сам.
      <input class="input" id="caller" type="tel" inputmode="tel" placeholder="+374 99 12 34 56">
    </label>
    <button class="btn btn-accent" id="start">Позвонить</button>
    <button class="btn btn-end" id="stop" hidden>Завершить</button>
    <div id="state"></div>
    <div class="transcript" id="log"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
  <script type="module">
    import { startCall } from "/realtime-call.js";
    const $ = (id) => document.getElementById(id);
    let voice = "female", speech = "elevenlabs", call = null;

    const pick = (sel, attr, set) => document.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => {
      set(b.dataset[attr]);
      document.querySelectorAll(sel).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }));
    pick(".voice[data-voice]", "voice", (v) => (voice = v));
    pick(".voice[data-speech]", "speech", (v) => (speech = v));

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      $("log").append(div);
      $("log").scrollTop = $("log").scrollHeight;
      return div;
    }

    const TEXT = {
      "tool.check": "Смотрю расписание…", "tool.checked": "Расписание проверено",
      "tool.book": "Записываю…", "tool.booked": "Записано ✓", "tool.failed": "Не удалось записать",
      "tool.error": "Ошибка календаря", "voice.error": "Ошибка голоса",
    };
    const STATES = { connected: "Соединено — говори", hearing: "Слышу тебя…", answering: "Отвечает…", listening: "Слушаю", unstable: "Связь нестабильна…", failed: "Связь прервалась" };

    async function start() {
      $("start").disabled = true;
      $("state").textContent = "Подключаю…";
      const caller = $("caller").value.trim();
      try { localStorage.setItem("bvCaller", caller); } catch {}
      try {
        call = await startCall({ voice, speech, caller }, {
          add,
          t: (k) => TEXT[k] ?? k,
          state: (s) => ($("state").textContent = STATES[s] ?? s),
          latency: (el, ms) => {
            const lat = document.createElement("span");
            lat.className = "lat";
            lat.textContent = `заговорил через ${(ms / 1000).toFixed(1)} с`;
            el.append(lat);
          },
        });
        $("start").hidden = true;
        $("stop").hidden = false;
      } catch (err) {
        console.error(err);
        $("state").textContent = `Не получилось: ${err.message}`;
      } finally {
        $("start").disabled = false;
      }
    }

    function stop() {
      call?.stop();
      call = null;
      $("start").hidden = false;
      $("stop").hidden = true;
      $("state").textContent = "Звонок завершён";
    }

    try { $("caller").value = localStorage.getItem("bvCaller") ?? ""; } catch {}
    $("start").addEventListener("click", start);
    $("stop").addEventListener("click", stop);
  </script>
</body>
</html>
