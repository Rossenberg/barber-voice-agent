<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Проверка ассистента — UMNIK</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23059669'/%3E%3Cpath d='M9 19v-6m4.7 9V10m4.6 12V10M23 19v-6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/landing.css">
  <style>
    body { background: var(--soft); }
    main { padding: 20px 0 60px; }
    .try-wrap { width: min(520px, 100% - 32px); margin-inline: auto; display: grid; gap: 14px; }
    .back { font-weight: 700; color: var(--green-2); text-decoration: none; font-size: 14.5px; }
    #transcript { max-height: 340px; }
    .err-card { padding: 28px 20px; border-radius: 24px; background: #fff; border: 1px solid var(--line); text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="try-wrap">
      <a class="back" href="/app/" data-i18n="back">← В кабинет</a>
      <div class="demo" id="assistant" hidden>
        <div class="demo-head">
          <div class="demo-shop">
            <span class="demo-av" id="av">U</span>
            <span><b id="shopName"></b><small><span class="pill-dot" id="pillDot"></span><span id="pillText"></span></small></span>
          </div>
          <span class="status" id="status" data-state="idle"></span>
        </div>
        <div class="modes" role="tablist">
          <button role="tab" data-mode="call" aria-selected="true"><span data-i18n="call">Позвонить</span></button>
          <button role="tab" data-mode="chat" aria-selected="false"><span data-i18n="chat">Написать</span></button>
        </div>

        <div id="callPane">
          <div class="voices" role="group">
            <button class="voice" data-voice="female" aria-pressed="true"><span class="av">Ա</span><span><b data-i18n="ani">Ани</b><span data-i18n="female">Женский голос</span></span></button>
            <button class="voice" data-voice="male" aria-pressed="false"><span class="av">Ա</span><span><b data-i18n="aram">Арам</b><span data-i18n="male">Мужской голос</span></span></button>
          </div>
          <div class="stage"><div class="orb" id="orb" data-mode="idle"><div class="ring"></div><div class="ring r2"></div><div class="halo"></div><div class="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 10v4M10.5 7v10M14 9v6M17.5 11v2"/></svg></div></div></div>
          <p class="label" id="label"></p>
          <div class="call-row">
            <button class="btn btn-primary btn-lg" id="startBtn"><span data-i18n="call">Позвонить</span></button>
            <button class="btn btn-end btn-lg" id="endBtn" hidden><span data-i18n="end">Завершить</span></button>
          </div>
          <div class="transcript" id="transcript"></div>
          <details class="caller" open>
            <summary data-i18n="callerSum">Номер звонящего</summary>
            <input class="input" id="callerPhone" type="tel" inputmode="tel" placeholder="+374 91 23 45 67">
            <p data-i18n="callerHint">По этому номеру ассистент находит записи, чтобы перенести или отменить их. На настоящей линии номер определится сам.</p>
          </details>
        </div>

        <div class="chat" id="chatPane" hidden>
          <div class="transcript chat-log" id="chatLog" aria-live="polite"></div>
          <form class="chat-form" id="chatForm">
            <input class="input" id="chatInput" autocomplete="off" maxlength="500">
            <button class="btn btn-primary chat-send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg></button>
          </form>
        </div>
      </div>
      <div class="err-card" id="notFound" hidden><b data-i18n="notFound">Бизнес не найден</b></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
  <script type="module" src="/try/try.js"></script>
</body>
</html>
