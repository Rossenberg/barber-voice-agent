<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Проверка ассистента — UMNIK</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23059669'/%3E%3Cpath d='M9 19v-6m4.7 9V10m4.6 12V10M23 19v-6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/landing.css">
  <style>
    body { background: var(--soft); }
    main { padding: 20px 0 60px; }
    .try-wrap { width: min(520px, 100% - 32px); margin-inline: auto; display: grid; gap: 14px; }
    .back { font-weight: 700; color: var(--green-2); text-decoration: none; font-size: 14.5px; }
    .hint { font-size: 14px; color: var(--muted); margin: 0; }
    .err-card { padding: 28px 20px; border-radius: 24px; background: #fff; border: 1px solid var(--line); text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="try-wrap">
      <a class="back" href="/app/" data-i18n="back">← В кабинет</a>
      <p class="hint" data-i18n="hint">Так ассистент отвечает вашим клиентам в чате и в Instagram Direct. Запись появится в вашем календаре.</p>
      <div class="demo" id="assistant" hidden>
        <div class="demo-head">
          <div class="demo-shop">
            <span class="demo-av" id="av">U</span>
            <span><b id="shopName"></b><small><span class="pill-dot" id="pillDot"></span><span id="pillText"></span></small></span>
          </div>
          <span class="status" id="status" data-state="idle"></span>
        </div>
        <div class="chat" id="chatPane">
          <div class="transcript chat-log" id="chatLog" aria-live="polite"></div>
          <form class="chat-form" id="chatForm">
            <label class="chat-photo" id="chatPhoto" hidden><input type="file" accept="image/*" id="chatFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="4"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 5l1.2-2h4.6l1.2 2"/></svg></label>
            <input class="input" id="chatInput" autocomplete="off" maxlength="500">
            <button class="btn btn-primary chat-send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg></button>
          </form>
        </div>
      </div>
      <div class="err-card" id="notFound" hidden><b data-i18n="notFound">Бизнес не найден</b></div>
    </div>
  </main>

  <script type="module" src="/try/try.js"></script>
</body>
</html>
