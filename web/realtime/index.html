<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Тест OpenAI Realtime — BarberVoice</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0c0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800&family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    main { padding: 20px 0 60px; display: grid; gap: 14px; }
    h1 { font-size: 26px; margin: 0; }
    .muted { color: var(--muted); font-size: 14px; margin: 0; }
    #state { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; }
    .lat { font-size: 11px; color: var(--ok); display: block; margin-top: 4px; font-weight: 600; }
    #log .msg { max-width: 92%; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>OpenAI Realtime</h1>
    <p class="muted">OpenAI слышит тебя и сразу придумывает ответ, а произносит его армянский голос ElevenLabs. Ассистент проверяет настоящее расписание и записывает — записи видны в панели барбера. Под каждым ответом видно, через сколько секунд после конца твоей фразы она заговорила.</p>
    <div class="voices" role="group" aria-label="Speech">
      <button class="voice" data-speech="elevenlabs" aria-pressed="true"><span class="av">Հ</span><span><b>Армянский голос</b><span>OpenAI думает, ElevenLabs говорит</span></span></button>
      <button class="voice" data-speech="openai" aria-pressed="false"><span class="av">AI</span><span><b>Голос OpenAI</b><span>с акцентом, для сравнения</span></span></button>
    </div>
    <div class="voices" role="group" aria-label="Voice">
      <button class="voice" data-voice="female" aria-pressed="true"><span class="av">Ա</span><span><b>Женский</b><span>Ани</span></span></button>
      <button class="voice" data-voice="male" aria-pressed="false"><span class="av">Ա</span><span><b>Мужской</b><span>Арам</span></span></button>
    </div>
    <button class="btn btn-accent" id="start">Позвонить</button>
    <button class="btn btn-end" id="stop" hidden>Завершить</button>
    <div id="state"></div>
    <div class="transcript" id="log"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
  <script type="module">
    import { createListener } from "/listener.js";
    const $ = (id) => document.getElementById(id);
    const DEBUG = new URLSearchParams(location.search).has("debug");
    let voice = "female", speech = "elevenlabs";
    let pc = null, stream = null, micTrack = null, actx = null, dc = null;
    let toolOutputs = []; // calendar results waiting for the current response to finish
    let stoppedAt = 0, agentEl = null, textBuf = "";
    let playEnd = 0, sources = [], unmuteTimer = null, speakGen = 0;
    // Every call is saved (text + the audio of each caller phrase) so recognition mistakes can be analysed.
    let callId = "", turn = 0, recorder = null, playing = false;
    function log(role, fields) {
      const form = new FormData();
      form.append("call_id", callId);
      form.append("turn", String(turn));
      form.append("role", role);
      for (const [k, v] of Object.entries(fields)) if (v !== undefined && v !== null) form.append(k, v);
      fetch("/api/rt-log", { method: "POST", body: form }).catch(() => {});
    }

    const pick = (sel, attr, set) => document.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => {
      set(b.dataset[attr]);
      document.querySelectorAll(sel).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }));
    pick(".voice[data-voice]", "voice", (v) => (voice = v));
    pick(".voice[data-speech]", "speech", (v) => (speech = v));

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      $("log").append(div);
      $("log").scrollTop = $("log").scrollHeight;
      return div;
    }

    function showLatency(el) {
      if (!stoppedAt || !el || el.querySelector(".lat")) return;
      const lat = document.createElement("span");
      lat.className = "lat";
      const ms = Math.round(performance.now() - stoppedAt);
      lat.textContent = `заговорил через ${(ms / 1000).toFixed(1)} с`;
      el.dataset.ms = String(ms);
      el.append(lat);
      stoppedAt = 0;
    }

    // The mic is muted while our own TTS plays, otherwise OpenAI would hear the assistant's voice as the caller.
    function setMic(on) {
      clearTimeout(unmuteTimer);
      if (on) unmuteTimer = setTimeout(() => micTrack && (micTrack.enabled = true), 250);
      else if (micTrack) micTrack.enabled = false;
    }

    /** Speaks a reply with ElevenLabs (streamed 24 kHz PCM, played as it arrives). */
    async function speak(text, el) {
      // A newer reply replaces the one still playing (OpenAI sometimes answers twice when it splits a long phrase).
      const gen = ++speakGen;
      sources.forEach((s) => { try { s.stop(); } catch {} });
      sources = [];
      playEnd = 0;
      const res = await fetch("/api/tts", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, voice }) });
      if (!res.ok || !res.body) return add(`Ошибка голоса: ${res.status}`, "tool");
      setMic(false);
      playing = true;
      const reader = res.body.getReader();
      let rest = new Uint8Array(0), first = true;
      playEnd = Math.max(playEnd, actx.currentTime + 0.05);
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        if (gen !== speakGen) { reader.cancel(); return; }
        const bytes = new Uint8Array(rest.length + value.length);
        bytes.set(rest); bytes.set(value, rest.length);
        const n = bytes.length >> 1;
        rest = bytes.slice(n * 2);
        if (!n) continue;
        const view = new DataView(bytes.buffer, 0, n * 2);
        const buf = actx.createBuffer(1, n, 24000);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) ch[i] = view.getInt16(i * 2, true) / 32768;
        const src = actx.createBufferSource();
        src.buffer = buf;
        src.connect(actx.destination);
        src.start(playEnd);
        sources.push(src);
        if (first) { first = false; showLatency(el); }
        playEnd += buf.duration;
      }
      const left = Math.max(0, playEnd - actx.currentTime);
      setTimeout(() => { if (actx && actx.currentTime >= playEnd - 0.01) { sources = []; playing = false; setMic(true); $("state").textContent = "Слушаю"; } }, left * 1000 + 30);
    }

    function onEvent(e) {
      const ev = JSON.parse(e.data);
      if (DEBUG) console.log(ev.type, ev);
      switch (ev.type) {
        case "input_audio_buffer.speech_started":
          $("state").textContent = "Слышу тебя…";
          break;
        case "input_audio_buffer.speech_stopped":
          turn++;
          stoppedAt = performance.now();
          agentEl = null;
          $("state").textContent = "Отвечает…";
          break;
        case "conversation.item.input_audio_transcription.completed":
          add(ev.transcript?.trim() || "…", "user");
          log("user", { text: ev.transcript?.trim() ?? "" });
          break;
        // OpenAI speaking itself
        case "output_audio_buffer.started":
          agentEl ??= add("", "agent");
          showLatency(agentEl);
          break;
        case "response.output_audio_transcript.done":
          agentEl ??= add("", "agent");
          agentEl.prepend(ev.transcript ?? "");
          log("agent", { text: ev.transcript ?? "", latency_ms: agentEl.dataset.ms });
          agentEl = null;
          $("state").textContent = "Слушаю";
          break;
        // text only: ElevenLabs speaks
        case "response.output_text.delta":
          textBuf += ev.delta ?? "";
          break;
        case "response.output_text.done": {
          const text = (ev.text ?? textBuf).trim();
          textBuf = "";
          if (!text) break;
          const el = add(text, "agent");
          speak(text, el).then(() => log("agent", { text, latency_ms: el.dataset.ms }));
          break;
        }
        // the assistant checks the calendar or books
        case "response.function_call_arguments.done": {
          const pending = add(ev.name === "create_booking" ? "Записываю…" : "Смотрю расписание…", "tool");
          let args = {};
          try { args = JSON.parse(ev.arguments || "{}"); } catch {}
          const ready = fetch("/api/rt-tool", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: ev.name, args }) })
            .then((r) => r.json())
            .catch(() => ({ error: "network" }))
            .then((result) => {
              pending.textContent = result.error ? "Ошибка календаря" : ev.name === "create_booking" ? (result.success ? "Записано ✓" : "Не удалось записать") : "Расписание проверено";
              if (!result.error) pending.classList.add("ok");
              log("event", { text: `${ev.name} ${JSON.stringify(args)} → ${JSON.stringify(result).slice(0, 600)}` });
              return { call_id: ev.call_id, output: JSON.stringify(result) };
            });
          toolOutputs.push(ready);
          break;
        }
        case "response.done":
          if (toolOutputs.length) {
            const outs = toolOutputs;
            toolOutputs = [];
            Promise.all(outs).then((items) => {
              for (const it of items) dc?.send(JSON.stringify({ type: "conversation.item.create", item: { type: "function_call_output", call_id: it.call_id, output: it.output } }));
              dc?.send(JSON.stringify({ type: "response.create" }));
            });
          }
          break;
        case "error":
          add(`Ошибка: ${ev.error?.message ?? "unknown"}`, "tool");
          break;
      }
    }

    async function start() {
      $("start").disabled = true;
      $("state").textContent = "Подключаю…";
      actx = new AudioContext(); // created on the tap so iPhone allows sound
      try {
        const sess = await (await fetch(`/api/realtime-session?voice=${voice}&speech=${speech}`, { method: "POST" })).json();
        if (!sess.key) throw new Error(sess.error || "no key");
        pc = new RTCPeerConnection();
        if (speech === "openai") {
          const audio = new Audio();
          audio.autoplay = true;
          pc.ontrack = (e) => (audio.srcObject = e.streams[0]);
        }
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        micTrack = stream.getTracks()[0];
        pc.addTrack(micTrack);
        pc.onconnectionstatechange = () => {
          const st = pc?.connectionState;
          if (st === "failed" || st === "disconnected") {
            $("state").textContent = st === "failed" ? "Связь прервалась" : "Связь нестабильна…";
            log("event", { text: `connection ${st}` });
          }
        };
        dc = pc.createDataChannel("oai-events");
        dc.onclose = () => log("event", { text: "data channel closed" });
        dc.onmessage = onEvent;
        // Fixed greeting from the dashboard instead of letting the model improvise the shop's name.
        const cfg = await (await fetch("/api/public/config", { cache: "no-store" })).json();
        const greeting = cfg.greeting.replaceAll("{shop}", cfg.shop_name_spoken || cfg.shop_name).replaceAll("{name}", voice === "male" ? "Արամ" : "Անի");
        dc.onopen = () => {
          if (speech === "elevenlabs") {
            dc.send(JSON.stringify({ type: "conversation.item.create", item: { type: "message", role: "assistant", content: [{ type: "output_text", text: greeting }] } }));
            speak(greeting, add(greeting, "agent"));
          } else {
            dc.send(JSON.stringify({ type: "response.create", response: { instructions: `Say exactly this greeting, nothing else: «${greeting}»` } }));
          }
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        const res = await fetch("https://api.openai.com/v1/realtime/calls", { method: "POST", body: offer.sdp, headers: { authorization: `Bearer ${sess.key}`, "content-type": "application/sdp" } });
        if (!res.ok) throw new Error(`OpenAI ${res.status}: ${(await res.text()).slice(0, 200)}`);
        await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
        callId = crypto.randomUUID();
        turn = 0;
        // our own copy of each caller phrase (same detector as /lab/), only for the log
        recorder = await createListener({
          onPhrase: (wav) => log("user_audio", { audio: new File([wav], "phrase.wav", { type: "audio/wav" }) }),
          isPaused: () => playing,
        }).catch((err) => (console.error("recorder", err), null));
        $("start").hidden = true;
        $("stop").hidden = false;
        $("state").textContent = "Соединено — говори";
      } catch (err) {
        console.error(err);
        $("state").textContent = `Не получилось: ${err.message}`;
        stop();
      } finally {
        $("start").disabled = false;
      }
    }

    function stop() {
      pc?.close();
      recorder?.stop();
      recorder = null;
      stream?.getTracks().forEach((t) => t.stop());
      sources.forEach((s) => { try { s.stop(); } catch {} });
      actx?.close();
      pc = null; stream = null; micTrack = null; actx = null; dc = null; sources = []; playEnd = 0; toolOutputs = [];
      $("start").hidden = false;
      $("stop").hidden = true;
      if (!$("state").textContent.startsWith("Не получилось")) $("state").textContent = "Звонок завершён";
    }

    $("start").addEventListener("click", start);
    $("stop").addEventListener("click", stop);
  </script>
</body>
</html>
