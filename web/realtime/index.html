<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Тест OpenAI Realtime — BarberVoice</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0c0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800&family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    main { padding: 20px 0 60px; display: grid; gap: 14px; }
    h1 { font-size: 26px; margin: 0; }
    .muted { color: var(--muted); font-size: 14px; margin: 0; }
    #state { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; }
    .lat { font-size: 11px; color: var(--ok); display: block; margin-top: 4px; font-weight: 600; }
    #log .msg { max-width: 92%; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>OpenAI Realtime</h1>
    <p class="muted">Здесь модель сама слышит и сразу отвечает голосом, как ChatGPT Voice. Календаря нет: любое время считается свободным. Послушай, как она говорит по-армянски и как быстро отвечает. Под каждым ответом видно, через сколько секунд после конца твоей фразы она заговорила.</p>
    <div class="voices" role="group" aria-label="Voice">
      <button class="voice" data-voice="female" aria-pressed="true"><span class="av">Ա</span><span><b>Женский</b><span>marin</span></span></button>
      <button class="voice" data-voice="male" aria-pressed="false"><span class="av">Ա</span><span><b>Мужской</b><span>cedar</span></span></button>
    </div>
    <button class="btn btn-accent" id="start">Позвонить</button>
    <button class="btn btn-end" id="stop" hidden>Завершить</button>
    <div id="state"></div>
    <div class="transcript" id="log"></div>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let voice = "female", pc = null, stream = null, stoppedAt = 0, latShown = false, agentEl = null;

    document.querySelectorAll(".voice").forEach((b) => b.addEventListener("click", () => {
      voice = b.dataset.voice;
      document.querySelectorAll(".voice").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }));

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      $("log").append(div);
      $("log").scrollTop = $("log").scrollHeight;
      return div;
    }

    function onEvent(e) {
      const ev = JSON.parse(e.data);
      if (new URLSearchParams(location.search).has("debug")) console.log(ev.type, ev);
      switch (ev.type) {
        case "input_audio_buffer.speech_started":
          $("state").textContent = "Слышу тебя…";
          break;
        case "input_audio_buffer.speech_stopped":
          stoppedAt = performance.now();
          latShown = false;
          agentEl = null;
          $("state").textContent = "Отвечает…";
          break;
        case "conversation.item.input_audio_transcription.completed":
          add(ev.transcript?.trim() || "…", "user");
          break;
        case "output_audio_buffer.started":
        case "response.output_audio.delta":
        case "response.output_audio_transcript.delta":
          if (stoppedAt && !latShown) {
            latShown = true;
            const sec = ((performance.now() - stoppedAt) / 1000).toFixed(1);
            agentEl = add("", "agent");
            agentEl.dataset.lat = sec;
          }
          if (ev.type === "response.output_audio_transcript.delta") {
            agentEl ??= add("", "agent");
            agentEl.textContent += ev.delta ?? "";
          }
          break;
        case "response.output_audio_transcript.done":
          agentEl ??= add("", "agent");
          agentEl.textContent = ev.transcript ?? agentEl.textContent;
          if (agentEl.dataset.lat) {
            const lat = document.createElement("span");
            lat.className = "lat";
            lat.textContent = `заговорила через ${agentEl.dataset.lat} с`;
            agentEl.append(lat);
          }
          agentEl = null;
          $("state").textContent = "Слушаю";
          break;
        case "error":
          add(`Ошибка: ${ev.error?.message ?? "unknown"}`, "tool");
          break;
      }
    }

    async function start() {
      $("start").disabled = true;
      $("state").textContent = "Подключаю…";
      try {
        const sess = await (await fetch(`/api/realtime-session?voice=${voice}`, { method: "POST" })).json();
        if (!sess.key) throw new Error(sess.error || "no key");
        pc = new RTCPeerConnection();
        const audio = new Audio();
        audio.autoplay = true;
        pc.ontrack = (e) => (audio.srcObject = e.streams[0]);
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        pc.addTrack(stream.getTracks()[0]);
        const dc = pc.createDataChannel("oai-events");
        dc.onmessage = onEvent;
        dc.onopen = () => dc.send(JSON.stringify({ type: "response.create", response: { instructions: "Greet the caller in Armenian in one short sentence: the barbershop name and «Ինչո՞վ օգնեմ»." } }));
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        const res = await fetch("https://api.openai.com/v1/realtime/calls", { method: "POST", body: offer.sdp, headers: { authorization: `Bearer ${sess.key}`, "content-type": "application/sdp" } });
        if (!res.ok) throw new Error(`OpenAI ${res.status}: ${(await res.text()).slice(0, 200)}`);
        await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
        $("start").hidden = true;
        $("stop").hidden = false;
        $("state").textContent = "Соединено — говори";
      } catch (err) {
        console.error(err);
        $("state").textContent = `Не получилось: ${err.message}`;
        stop();
      } finally {
        $("start").disabled = false;
      }
    }

    function stop() {
      pc?.close();
      stream?.getTracks().forEach((t) => t.stop());
      pc = null;
      stream = null;
      $("start").hidden = false;
      $("stop").hidden = true;
      if (!$("state").textContent.startsWith("Не получилось")) $("state").textContent = "Звонок завершён";
    }

    $("start").addEventListener("click", start);
    $("stop").addEventListener("click", stop);
  </script>
</body>
</html>
